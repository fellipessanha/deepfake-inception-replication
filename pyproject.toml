[project]
name = "inception-replication"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fellipessanha", email = "fellipe900@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
metrics = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]
video = [
    "facenet-pytorch>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
inception-replication = "inception_replication:main"
inception-report = "inception_replication.classification.reports:_main"
saliency-visualize = "inception_replication.saliency.visualize:_main"
saliency-spotlight = "inception_replication.saliency.visualize:_spotlight_main"
saliency-vlm-input = "inception_replication.saliency.vlm_input:_main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # Local work gets every extra, so plain `uv run` keeps them installed.
    "inception-replication[metrics,video]",
]
saliency = [
    "captum>=0.9.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
# saliency commands need captum, so plain `uv run saliency-*` works without --group
default-groups = ["dev", "saliency"]

[tool.basedpyright]
typeCheckingMode = "standard"
