[project]
name = "inception-replication"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fellipessanha", email = "fellipe900@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
metrics = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
]
video = [
    "facenet-pytorch>=2.5.3",
    "opencv-python>=5.0.0.93",
]
# Pick at most one. No extra = same as `cuda`.
cuda = [
    "torch>=2.8",
    "torchvision>=0.23",
]
# Pascal GPUs (e.g. Tesla P100) on old drivers (>=450): torch 2.7 is the last built for CUDA 11.8
pascal = [
    "torch>=2.6,<2.8", # transformers 5 needs >=2.6
    "torchvision<0.23",
]

[project.scripts]
inception-replication = "inception_replication:main"
inception-report = "inception_replication.classification.reports:_main"
saliency-visualize = "inception_replication.saliency.visualize:_main"
saliency-spotlight = "inception_replication.saliency.visualize:_spotlight_main"
saliency-vlm-input = "inception_replication.saliency.vlm_input:_main"
vlm-explain = "inception_replication.vlm_interpretation.face_explanation:_main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # Local work gets every extra, so plain `uv run` keeps them installed.
    "inception-replication[metrics,video]",
]
saliency = [
    "captum>=0.9.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]
vlm = [
    "transformers>=4.57", # Qwen3-VL
    "accelerate",         # device_map
    "bitsandbytes",       # 4-bit loading
]

[tool.uv]
# saliency/vlm commands need captum/transformers, so plain `uv run saliency-*` / `vlm-explain` works without --group
default-groups = ["dev", "saliency", "vlm"]
# lets the lock hold both torch builds; uv needs two entries, hence the `cuda` extra
conflicts = [[{ extra = "pascal" }, { extra = "cuda" }]]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true # only torch/torchvision come from here, and only with --extra pascal

[tool.uv.sources]
torch = { index = "pytorch-cu118", extra = "pascal" }
torchvision = { index = "pytorch-cu118", extra = "pascal" }

[tool.basedpyright]
typeCheckingMode = "standard"
